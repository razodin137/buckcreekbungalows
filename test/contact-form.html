<form id="contact-form">
  <label>Your Name:</label>
  <input type="text" name="customer_name" required>

  <label>Your Email:</label>
  <input type="email" name="customer_email" required>

  <label>Message:</label>
  <textarea name="customer_message" required></textarea>

  <button type="submit">Submit Form</button>
</form>

<script>
  document.getElementById('contact-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = {
      name: e.target.customer_name.value,
      email: e.target.customer_email.value,
      message: e.target.customer_message.value
    };

    const response = await fetch('https://worker-email-form-rev2.YOUR_SUBDOMAIN.workers.dev/api/forms', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(formData)
    });

    if (response.ok) {
      alert('Thank you! Your message has been sent.');
      e.target.reset();
    } else {
      alert('Oops, something went wrong.');
    }
  });
</script>
