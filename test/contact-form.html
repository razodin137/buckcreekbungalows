<form id="contact-form">
  <label>Your Name:</label>
  <input type="text" name="customer_name" required>

  <label>Your Email:</label>
  <input type="email" name="customer_email" required>

  <label>Message:</label>
  <textarea name="customer_message" required></textarea>

  <button type="submit">Submit</button>
</form>

<script>
  document.getElementById('contact-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = {
      name: e.target.customer_name.value,
      email: e.target.customer_email.value,
      message: e.target.customer_message.value
    };

    try {
      const res = await fetch('https://calm-recipe-1d8b.jcamnorman.workers.dev/api/forms', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      });

      if (res.ok) {
        alert('Message sent.');
        e.target.reset();
      } else {
        alert('Failed to send. Check Worker logs.');
      }
    } catch (err) {
      alert('Network error.');
      console.error(err);
    }
  });
</script>
